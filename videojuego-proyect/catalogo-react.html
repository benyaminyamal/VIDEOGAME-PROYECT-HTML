<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoJuegos — Catálogo con React</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
    <div id="root"></div>

    <!-- React, ReactDOM y Babel desde CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function formatearPrecio(valor) {
            return valor.toLocaleString("es-CL", {
                style: "currency", currency: "CLP", minimumFractionDigits: 0
            });
        }

        function App() {
            // useState: catalogo, carrito, estados de carga y boton interactivo
            const [productos, setProductos] = useState([]);
            const [carrito, setCarrito] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState(null);
            const [suscrito, setSuscrito] = useState(false);

            // useEffect: simula la carga de datos desde una fuente externa al iniciar
            useEffect(() => {
                fetch("productos.json")
                    .then((res) => {
                        if (!res.ok) throw new Error("No se pudo cargar el archivo");
                        return res.json();
                    })
                    .then((datos) => {
                        // pequeño retardo para simular la espera de una API
                        setTimeout(() => {
                            setProductos(datos);
                            setCargando(false);
                        }, 800);
                    })
                    .catch(() => {
                        setError("No pudimos cargar los productos. Intenta mas tarde.");
                        setCargando(false);
                    });
            }, []);

            const estaEnCarrito = (id) => carrito.some((item) => item.id === id);

            // Agrega el producto o, si ya esta, lo quita (toggle)
            function alternarCarrito(producto) {
                if (estaEnCarrito(producto.id)) {
                    setCarrito(carrito.filter((item) => item.id !== producto.id));
                } else {
                    setCarrito([...carrito, { ...producto, cantidad: 1 }]);
                }
            }

            function eliminarDelCarrito(id) {
                setCarrito(carrito.filter((item) => item.id !== id));
            }

            function cambiarCantidad(id, delta) {
                setCarrito(
                    carrito
                        .map((item) =>
                            item.id === id ? { ...item, cantidad: item.cantidad + delta } : item
                        )
                        .filter((item) => item.cantidad > 0)
                );
            }

            const totalUnidades = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);

            return (
                <React.Fragment>
                    <nav className="navbar navbar-expand-lg navbar-dark py-3">
                        <div className="container">
                            <a className="navbar-brand fw-bold" href="inicio.html">
                                <i className="bi bi-controller"></i> TodoJuegos
                            </a>
                            <div className="ms-auto d-flex align-items-center gap-3">
                                {/* Boton interactivo que cambia de texto al hacer clic (useState) */}
                                <button
                                    className={suscrito ? "btn btn-success btn-sm" : "btn btn-outline-light btn-sm"}
                                    onClick={() => setSuscrito(!suscrito)}
                                >
                                    {suscrito ? "Suscrito \u2713" : "Suscribirme a ofertas"}
                                </button>
                                <span className="text-white">
                                    <i className="bi bi-cart3 fs-5"></i>{" "}
                                    <span className="badge bg-warning text-dark">{totalUnidades}</span>
                                </span>
                            </div>
                        </div>
                    </nav>

                    <header className="hero text-center text-white py-5">
                        <div className="container">
                            <h1 className="display-5 fw-bold">Catálogo (React)</h1>
                            <p className="lead mb-0">
                                Versión del catálogo gestionada con React, useState y useEffect.
                            </p>
                        </div>
                    </header>

                    <main className="container my-5">
                        <div className="row">
                            {/* Columna del catalogo */}
                            <div className="col-lg-8">
                                <h2 className="titulo-seccion mb-4">Productos</h2>

                                {/* Renderizado condicional: carga / error / lista */}
                                {cargando && (
                                    <div className="text-center py-5">
                                        <div className="spinner-border text-light" role="status"></div>
                                        <p className="mt-3">Cargando productos...</p>
                                    </div>
                                )}

                                {error && !cargando && (
                                    <div className="alert alert-danger">{error}</div>
                                )}

                                {!cargando && !error && (
                                    <div className="row g-4">
                                        {productos.map((producto) => (
                                            <div className="col-12 col-sm-6" key={producto.id}>
                                                <article className="card card-producto h-100">
                                                    <img
                                                        src={producto.imagen}
                                                        className="card-img-top"
                                                        alt={"Portada de " + producto.nombre}
                                                    />
                                                    <div className="card-body d-flex flex-column">
                                                        <span className="badge badge-categoria align-self-start mb-2">
                                                            {producto.categoria}
                                                        </span>
                                                        <h3 className="h6 card-title">{producto.nombre}</h3>
                                                        <p className="card-text small flex-grow-1">
                                                            {producto.descripcion}
                                                        </p>
                                                        <div className="d-flex justify-content-between align-items-center mt-2">
                                                            <span className="precio fw-bold">
                                                                {formatearPrecio(producto.precio)}
                                                            </span>
                                                            {/* Renderizado condicional del boton segun el estado */}
                                                            <button
                                                                className={
                                                                    estaEnCarrito(producto.id)
                                                                        ? "btn btn-success btn-sm"
                                                                        : "btn btn-agregar btn-sm"
                                                                }
                                                                onClick={() => alternarCarrito(producto)}
                                                            >
                                                                {estaEnCarrito(producto.id) ? (
                                                                    <span><i className="bi bi-check2"></i> En el carrito</span>
                                                                ) : (
                                                                    <span><i className="bi bi-cart-plus"></i> Agregar al carrito</span>
                                                                )}
                                                            </button>
                                                        </div>
                                                    </div>
                                                </article>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Columna del carrito */}
                            <div className="col-lg-4 mt-5 mt-lg-0">
                                <div className="offcanvas-cart p-3" style={{ backgroundColor: "#1b1b2f", border: "2px solid #4c1d95", borderRadius: "8px", position: "sticky", top: "20px" }}>
                                    <h2 className="h5 mb-3">
                                        <i className="bi bi-cart3"></i> Tu carrito ({totalUnidades})
                                    </h2>

                                    {/* Renderizado condicional: mensaje si el carrito esta vacio */}
                                    {carrito.length === 0 ? (
                                        <p className="text-center text-secondary my-4">
                                            Tu carrito está vacío.
                                        </p>
                                    ) : (
                                        <React.Fragment>
                                            {carrito.map((item) => (
                                                <div
                                                    key={item.id}
                                                    className="item-carrito d-flex justify-content-between align-items-center py-2"
                                                >
                                                    <div>
                                                        <p className="mb-0 fw-semibold small">{item.nombre}</p>
                                                        <small className="text-secondary">
                                                            {formatearPrecio(item.precio)}
                                                        </small>
                                                    </div>
                                                    <div className="d-flex align-items-center gap-2">
                                                        <button className="btn btn-sm btn-outline-light py-0" onClick={() => cambiarCantidad(item.id, -1)}>-</button>
                                                        <span>{item.cantidad}</span>
                                                        <button className="btn btn-sm btn-outline-light py-0" onClick={() => cambiarCantidad(item.id, 1)}>+</button>
                                                        <button className="btn btn-sm btn-quitar" onClick={() => eliminarDelCarrito(item.id)}>
                                                            <i className="bi bi-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            <div className="border-top pt-3 mt-3 d-flex justify-content-between fw-bold fs-5">
                                                <span>Total:</span>
                                                <span>{formatearPrecio(totalPrecio)}</span>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer id="contacto" className="text-center py-4 mt-5">
                        <div className="container">
                            <p className="mb-1">TodoJuegos — Av. Providencia 1234, Santiago, Chile</p>
                            <p className="mb-0">Teléfono: +56 9 1234 5678 | Correo: contacto@todojuegos.cl</p>
                        </div>
                    </footer>
                </React.Fragment>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
